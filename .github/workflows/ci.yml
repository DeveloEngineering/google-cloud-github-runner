name: "CI"

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: "Python 🐍"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: 📥 Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 🔍 Lint with flake8
        run: |
          flake8 --ignore=W292,W503 --max-line-length=127 --show-source --statistics *.py app/*.py app/routes/*.py app/services/*.py app/clients/*.py app/utils/*.py tests/*.py tests/integration/*.py tests/unit/*.py

      - name: 🧪 Run tests
        run: |
          python -m pytest tests/ --cov

  terraform:
    name: "Terraform 🏗️"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gcp
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: 🔍 Terraform Format
        run: terraform fmt -check -recursive

      - name: 📋 Terraform Init
        run: terraform init -backend=false

      - name: 🔍 Terraform Validate
        run: terraform validate

      # TFLint and tfsec are installed from pinned, checksum-verified release
      # binaries: the org Actions allowlist blocks terraform-linters/setup-tflint
      # and aquasecurity/tfsec-action.
      - name: 🔒 Install TFLint
        env:
          TFLINT_VERSION: v0.66.0
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          curl -fsSLO "${base}/tflint_linux_amd64.zip"
          curl -fsSLO "${base}/checksums.txt"
          grep ' tflint_linux_amd64.zip$' checksums.txt | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          unzip -q tflint_linux_amd64.zip -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: 🔍 Run TFLint
        run: tflint

      - name: 🛡️ Run tfsec
        env:
          TFSEC_VERSION: 1.28.14
        run: |
          tarball="tfsec_${TFSEC_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION}"
          (
            cd "$RUNNER_TEMP"
            curl -fsSLO "${base}/${tarball}"
            curl -fsSLO "${base}/tfsec_${TFSEC_VERSION}_checksums.txt"
            grep " ${tarball}$" "tfsec_${TFSEC_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "${tarball}" tfsec
          )
          "$RUNNER_TEMP/tfsec" .

  shell:
    name: "Shell 🐚"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🔍 ShellCheck
        run: |
          shellcheck tools/*.sh && shellcheck gcp/*.sh && shellcheck gcp/startup/*.sh

  docker:
    name: "Docker 🐳"
    needs: [python, terraform, shell]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7

      - name: 🏗️ Build Docker image
        run: |
          docker build -t google-cloud-github-runner .

      - name: 🚀 Start Docker container
        run: |
          docker run -d --name google-cloud-github-runner -p 8080:8080 google-cloud-github-runner

      - name: ⏳ Wait for container to be ready
        run: |
          # Wait for up to 30 seconds for the service to respond
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Container is ready!"
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 1
          done
          echo "Container failed to start in time"
          docker logs google-cloud-github-runner
          exit 1

      - name: 🔍 Access Container web app via curl
        run: |
          curl -v http://localhost:8080

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop google-cloud-github-runner || true
          docker rm google-cloud-github-runner || true
